name: Auto-Sync Hue 1880 3D from Google Drive (Every 6 Hours)

on:
  schedule:
    # Tự động đồng bộ 8 lần/ngày mỗi 3 tiếng khớp chu kỳ 100 Task Neon (800 lượt/ngày)
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      include_inbox:
        description: "Lấy cả bản GLB, Gameplay & Giọng đọc AI mới từ các hòm thư inbox"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: hue-1880-drive-sync
  cancel-in-progress: false

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12 and Free Neural TTS
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts for voice_inbox synthesis
        run: pip install --quiet edge-tts

      - name: Configure git bot author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Hue 1880 tiles, props, quests and AI voices from Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          REQUIRE_DRIVE_AUTH: "1"
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.include_inbox }}" = "false" ]; then
            EXTRA_ARGS="--no-inbox"
          fi
          python3 scripts/sync_from_drive.py --push $EXTRA_ARGS
